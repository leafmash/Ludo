name: Build APK from drop

on:
  push:
    paths:
      - "drop/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract newest zip from drop
        run: |
          ZIP=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- 'drop/*.zip' | grep -v '^$' | head -n 1)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls -t drop/*.zip 2>/dev/null | head -n 1)
          fi
          if [ -z "$ZIP" ]; then
            echo "No zip found in drop/"
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work
          PROJECT_FILE=$(find work -name project.godot -not -path "*/.godot/*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot not found in zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls "$ANDROID_HOME/build-tools"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storetype PKCS12

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          for NAME in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > "$HOME/.config/godot/$NAME" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Import project resources
        run: |
          godot --headless --path "$PROJECT_DIR" --import || true

      - name: Self test
        continue-on-error: true
        run: |
          if [ -f "$PROJECT_DIR/tests/selftest.gd" ]; then
            godot --headless --path "$PROJECT_DIR" --script res://tests/selftest.gd 2>&1 | tee selftest.log
            grep -q "SELFTEST PASS" selftest.log
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/ludo.apk"
          ls -l build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-apk
          path: build/ludo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ludo build ${{ github.run_number }}
          files: build/ludo.apk
